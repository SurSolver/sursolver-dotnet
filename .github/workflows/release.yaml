name: release

# One workflow: every push and pull request runs the full test job; a pushed tag vX.Y.Z also
# publishes to nuget.org, but only after the test job has passed.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'
      - run: dotnet build src/SurSolver -c Release
      - run: dotnet test tests/SurSolver.Tests -c Release -p:TestTargetFramework=net10.0
      - run: dotnet pack src/SurSolver -c Release -o artifacts

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write # NuGet trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'
      - name: Tag matches <Version>
        run: grep -q "<Version>${GITHUB_REF_NAME#v}</Version>" src/SurSolver/SurSolver.csproj
      - run: dotnet pack src/SurSolver -c Release -o artifacts
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
